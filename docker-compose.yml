version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:vetpassword123@postgres:5432/vetdb?schema=public
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: vet_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vetpassword123
      POSTGRES_DB: vetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
